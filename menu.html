<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="css/menu.css">

<body>
    <header>
        <nav>
            <article class="containerNav">
                <div class="logo">

                <ul class="navLink">

            </article>
        </nav>
        <div class="containerHeader">
            <h1>Descubrí sabores que inspiran.</h1>

            <p class="pClaro">

            <a href="#menu" class="btnMenu">Explorar menú</a>

        <div class="separadorOndas">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">

        </div>

            <article class="container">
                <article class="emparedadoG" id="emparedadosId">

                </article>
            </article>
        </section>
        <div class="separadorOndas">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                <path d="M0,30 C240,100 480,0 720,45
               C960,100 1200,10 1440,50

            </svg>
